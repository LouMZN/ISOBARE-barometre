# Test manuel des sources du baromètre (onglet Actions > test-sources > Run workflow).
# Le tableau des résultats s'affiche dans le résumé de l'exécution.
name: test-sources

on:
  workflow_dispatch:

jobs:
  test-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install -r collect/requirements.txt
      - name: Tester les sources
        run: python collect/test_sources.py
